spring:
  datasource:
    url: jdbc:h2:mem:scheduledb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      path: /h2-console
      enabled: true

  jpa:
    hibernate:
      ddl-auto: create-drop # 앱 시작 시 테이블 생성, 종료 시 삭제
    show-sql: true

jwt:
  secret: dev-secret-key-for-local-only-change-in-production

logging:
  level:
    org.hibernate.SQL: debug
    com.lmh: debug