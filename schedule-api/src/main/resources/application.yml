spring:
  application:
    name: "schedule-api"
  profiles:
    active: dev # 기본 활성 프로파일

  jpa:
    open-in-view: false # OSIV 비활성화(성능 이슈 방지)
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET} # 환경변수로 주입
  access-token-expiry: 1800000 # 30분(ms)
  refresh-token-expiry: 604800000 # 7일(ms)

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs